server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 入口 HTML 不缓存，保证新版本立即可见
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带 hash 的静态资源可长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 单页应用回退（本页只有一个路由，仍保留标准做法）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
